    iframe { width:100%; height:70dvh; border:0; border-radius:12px; background:#fff; } .toast { position:fixed; z-index:80; top:94px; left:50%; transform:translate(-50%,-8px); opacity:0; pointer-events:none; padding:10px 14px; background:#142f4a; border:1px solid rgba(105,235,203,.35); border-radius:12px; box-shadow:var(--shadow); transition:.2s; } .toast.show { transform:translate(-50%,0); opacity:1; }

<body>
  <div class="app">
    <header class="topbar"><div class="brand"><div class="bolt">ϟ</div><span>ElectroTrack</span></div><div class="streak" id="streak">🔥 1-day streak</div></header>

  <script>
  (() => {
    const SUBJECTS = [
      {id:'circuits', icon:'◉', name:'Circuit Theory', color:'#52a9ff', topics:[
        ['Network laws & theorems',['KCL and KVL','Source transformation','Thevenin, Norton, superposition']],
        ['DC circuit analysis',['Mesh and nodal analysis','Maximum power transfer','Star–delta transformation']],
        ['AC fundamentals',['Phasors and impedance','Power and power factor','Resonance']],
        ['Transient analysis',['RL and RC circuits','RLC response','Laplace transform methods']]
      ]},
      {id:'machines', icon:'ϟ', name:'Electrical Machines', color:'#69ebcb', topics:[
        ['Transformers',['Equivalent circuit','Voltage regulation','Three-phase transformers']],
        ['DC machines',['EMF and torque','Characteristics','Speed control']],
        ['Induction machines',['Rotating magnetic field','Torque-slip characteristics','Starting and speed control']],
        ['Synchronous machines',['Alternator fundamentals','Power-angle equation','Synchronous motors']]
      ]},
      {id:'power', icon:'⌁', name:'Power Systems', color:'#ffc864', topics:[
        ['Generation & economics',['Thermal and hydro stations','Load curves','Economic dispatch']],
        ['Transmission lines',['Line parameters','ABCD constants','Power flow basics']],
        ['Fault analysis',['Symmetrical components','Balanced faults','Unsymmetrical faults']],
        ['Protection & switchgear',['Relays','Circuit breakers','Protection schemes']]
      ]},
      {id:'power-electronics', icon:'⌁', name:'Power Electronics', color:'#ff9a7a', topics:[
        ['Power semiconductor devices',['SCR and TRIAC','MOSFET and IGBT','Gate drive basics']],
        ['Controlled rectifiers',['Single-phase converters','Three-phase converters','Commutation']],
        ['Choppers & inverters',['DC choppers','Voltage source inverter','PWM techniques']],
        ['Drives & applications',['SMPS','Electric drives','Renewable interfaces']]
      ]},
      {id:'control', icon:'↝', name:'Control Systems', color:'#aa9bff', topics:[
        ['Modelling',['Transfer functions','Block diagrams','Signal flow graphs']],
        ['Time response',['First and second order','Steady-state error','Routh stability']],
        ['Frequency response',['Bode plots','Nyquist criterion','Gain and phase margin']],
        ['State space & design',['State variables','Controllability','PID compensation']]
      ]},
      {id:'signals', icon:'∿', name:'Signals & Systems', color:'#72c4ff', topics:[
        ['Signal basics',['Continuous/discrete signals','Periodic signals','Energy and power']],
        ['LTI systems',['Convolution','Impulse response','System properties']],
        ['Transforms',['Fourier series','Fourier transform','Z-transform']],
        ['Sampling',['Sampling theorem','Aliasing','Reconstruction']]
      ]},
      {id:'measurements', icon:'⌁', name:'Measurements', color:'#ffd080', topics:[
        ['Measurement principles',['Standards and errors','Static characteristics','Dynamic response']],
        ['Electrical instruments',['PMMC and MI meters','Wattmeters','Energy meters']],
        ['Sensors & transducers',['Strain gauges','LVDT','Temperature sensors']],
        ['Data acquisition',['Bridges','Signal conditioning','Digital instruments']]
      ]},
      {id:'electronics', icon:'⊞', name:'Electronics', color:'#f4a3ff', topics:[
        ['Analog electronics',['Diodes and rectifiers','BJT and FET amplifiers','Operational amplifiers']],
        ['Digital electronics',['Boolean algebra','Combinational logic','Sequential logic']],
        ['Communication basics',['Modulation','Noise','Digital communication']],
        ['Microprocessors',['Architecture','Interfacing','Embedded fundamentals']]

      {id:'emft', icon:'⊹', name:'Electromagnetics', color:'#83e7bd', topics:[
        ['Electrostatics',['Coulomb’s law','Electric field','Capacitance']],
        ['Magnetostatics',['Biot–Savart law','Ampère’s law','Magnetic circuits']],

      {id:'maths', icon:'∑', name:'Engineering Maths', color:'#8cb6ff', topics:[

        ['Calculus',['Differentiation','Integration','Differential equations']],
        ['Probability & statistics',['Random variables','Distributions','Estimation']],
        ['Numerical methods',['Roots of equations','Interpolation','Numerical integration']]
      ]}
    ];
    const QUESTIONS = [
      {id:'q1',s:'circuits',t:0,q:'A 10 Ω resistor carries a 2 A current. What is the voltage across it?',a:['5 V','10 V','20 V','40 V'],c:2,e:'Ohm’s law gives V = IR = 2 × 10 = 20 V.'},
      {id:'q2',s:'circuits',t:0,q:'The Thevenin equivalent of a linear two-terminal network consists of:',a:['A voltage source in series with a resistance','A current source in series with a resistance','Two voltage sources in parallel','A resistor only'],c:0,e:'A Thevenin model is Vth in series with Rth.'},
      {id:'q3',s:'machines',t:0,q:'A transformer operates on the principle of:',a:['Self induction only','Mutual induction','Electrostatic induction','Hall effect'],c:1,e:'Changing flux from the primary induces emf in the secondary by mutual induction.'},
      {id:'q4',s:'machines',t:2,q:'At synchronous speed, the slip of an induction motor is:',a:['0','1','0.5','Infinite'],c:0,e:'Slip is (Ns − Nr)/Ns; at synchronous speed Nr = Ns.'},
      {id:'q5',s:'power',t:2,q:'For a balanced three-phase fault, which method is generally used?',a:['Symmetrical components','Per-unit system only','DC load flow only','Laplace transform'],c:0,e:'Only the positive-sequence network is needed for a balanced three-phase fault.'},
      {id:'q6',s:'power-electronics',t:0,q:'Which device is a fully controllable power semiconductor switch?',a:['Diode','SCR','IGBT','DIAC'],c:2,e:'An IGBT is controllable both for turn-on and turn-off through its gate signal.'},
      {id:'q7',s:'control',t:1,q:'A stable second-order system has a damping ratio ζ equal to:',a:['A negative value','A value greater than zero','Exactly zero','Always one'],c:1,e:'A positive damping ratio is required for asymptotic stability in a standard second-order form.'},
      {id:'q8',s:'signals',t:3,q:'To avoid aliasing, the sampling frequency must be:',a:['Less than signal bandwidth','At least twice the highest frequency','Exactly the highest frequency','Independent of signal frequency'],c:1,e:'The Nyquist sampling criterion is fs ≥ 2fmax.'},
      {id:'q9',s:'measurements',t:1,q:'A PMMC instrument is primarily used for:',a:['AC only','DC measurements','High-frequency signals','Temperature measurement'],c:1,e:'The torque direction reverses with AC, so a PMMC movement is mainly used for DC.'},
      {id:'q10',s:'electronics',t:1,q:'Which logic gate produces a HIGH output only when all inputs are HIGH?',a:['OR','XOR','AND','NOR'],c:2,e:'The AND function is true only when every input is true.'},
      {id:'q11',s:'emft',t:2,q:'Faraday’s law relates induced emf to:',a:['Charge density','Rate of change of magnetic flux','Resistance','Electric potential only'],c:1,e:'Induced emf equals the negative time rate of change of magnetic flux linkage.'},
      {id:'q12',s:'maths',t:1,q:'The derivative of sin(x) is:',a:['cos(x)','−cos(x)','sin(x)','−sin(x)'],c:0,e:'d/dx sin(x) = cos(x).'},
      {id:'q13',s:'circuits',t:1,q:'Which method writes one equation for each essential node voltage?',a:['Mesh analysis','Nodal analysis','Superposition only','Fourier analysis'],c:1,e:'Nodal analysis uses Kirchhoff’s current law at the essential nodes.'},
      {id:'q14',s:'circuits',t:2,q:'At series resonance, the impedance of an RLC circuit is:',a:['Maximum and inductive','Minimum and resistive','Zero in all cases','Infinite'],c:1,e:'Inductive and capacitive reactances cancel, leaving the resistance.'},
      {id:'q15',s:'circuits',t:3,q:'The initial current through an inductor cannot change abruptly because:',a:['It stores electric charge','It opposes change in current','Its resistance is infinite','Voltage is always zero'],c:1,e:'An abrupt current change would require an unbounded inductor voltage.'},
      {id:'q16',s:'machines',t:1,q:'The back emf of a DC motor is proportional to:',a:['Flux and armature speed','Armature resistance only','Load torque only','Number of poles only'],c:0,e:'The generated/back emf is E = kΦω.'},
      {id:'q17',s:'machines',t:3,q:'A synchronous motor normally runs at:',a:['A speed below synchronous speed','Synchronous speed','A speed above synchronous speed','Zero slip only at no load'],c:1,e:'Its rotor locks to the rotating stator field and runs at synchronous speed.'},
      {id:'q18',s:'power',t:0,q:'The load factor of a station is the ratio of:',a:['Maximum demand to connected load','Average load to maximum demand','Connected load to average load','Demand factor to diversity factor'],c:1,e:'Load factor = average load ÷ maximum demand over the same period.'},
      {id:'q19',s:'power',t:1,q:'The per-unit system is useful in power-system studies because it:',a:['Eliminates all losses','Normalizes values across voltage levels','Only applies to DC networks','Makes frequency irrelevant'],c:1,e:'Common base values make quantities across transformers and voltage levels easy to compare.'},
      {id:'q20',s:'power',t:3,q:'The primary purpose of a protective relay is to:',a:['Generate power','Detect abnormal conditions and initiate isolation','Raise transmission voltage','Improve power factor'],c:1,e:'Relays detect faults and command breakers to isolate the affected section.'},
      {id:'q21',s:'power-electronics',t:1,q:'An SCR turns off naturally in an AC circuit when current:',a:['Reaches its holding value from above','Exceeds rated value','Becomes zero','Is gated again'],c:2,e:'Natural commutation occurs when the alternating current crosses zero.'},

    const EXAMS = [
      {month:'GATE',day:'EE',name:'GATE 2027 Electrical Engineering',body:'Official registration, dates and information bulletin.',source:'https://gate2027.iitm.ac.in/'},

    const STORAGE='electrotrack-ee-v1';

    const dayKey=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const ago=(days)=>{const d=new Date();d.setDate(d.getDate()-days);return d.toISOString();};
    const pastDay=(days)=>{const d=new Date();d.setDate(d.getDate()-days);return dayKey(d);};
    const starter=()=>({profile:{name:'Engineer', dailyGoal:45},progress:{
      'circuits-0':{minutes:35,questions:2,correct:2,lastRevised:ago(9),stage:2},

    },sessions:[{date:dayKey(),minutes:15,subject:'circuits',topic:0},{date:pastDay(1),minutes:25,subject:'machines',topic:2},{date:pastDay(2),minutes:40,subject:'power',topic:2}],answered:{q1:{correct:true},q2:{correct:true},q3:{correct:true},q5:{correct:false}},pdfs:[],active:null});
    let state; try{state=JSON.parse(localStorage.getItem(STORAGE))||starter()}catch{state=starter()}

    const subj=(id)=>SUBJECTS.find(x=>x.id===id); const key=(id,t)=>`${id}-${t}`;

    const minutes=(id,t)=>t===undefined?subj(id).topics.reduce((n,_,i)=>n+(progress(id,i).minutes||0),0):(progress(id,t).minutes||0);
    const qCount=(id,t)=>t===undefined?subj(id).topics.reduce((n,_,i)=>n+(progress(id,i).questions||0),0):(progress(id,t).questions||0);
    const topicDone=(id,t)=>!!progress(id,t).done;
    const subjectDone=(id)=>subj(id).topics.filter((_,t)=>topicDone(id,t)).length;
    const totalMins=()=>Object.values(state.progress).reduce((n,x)=>n+(x.minutes||0),0);
    const formatMins=(m)=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m||0}m`;
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const dueInfo=(id,t)=>{const p=progress(id,t); if(!p.lastRevised) return {due:true,label:'Not reviewed',age:999}; const elapsed=Math.floor((Date.now()-new Date(p.lastRevised).getTime())/86400000); const intervals=[1,3,7,14,30];const target=intervals[Math.min(p.stage||0,4)];return {due:elapsed>=target,label:elapsed===0?'Reviewed today':`${elapsed}d ago`,age:elapsed-target};};
    const dueTopics=()=>SUBJECTS.flatMap(s=>s.topics.map((t,i)=>({s,t,i,...dueInfo(s.id,i)}))).filter(x=>x.due).sort((a,b)=>b.age-a.age);
    const subjectReview=(id)=>{const latest=Math.max(...subj(id).topics.map((_,i)=>new Date(progress(id,i).lastRevised||0).getTime()));if(!latest||latest<1)return 'not revised yet';const elapsed=Math.max(0,Math.floor((Date.now()-latest)/86400000));return elapsed===0?'reviewed today':`last review ${elapsed}d ago`;};
    const daily=(offset)=>{const d=new Date();d.setDate(d.getDate()+offset);const ds=dayKey(d);return state.sessions.filter(x=>x.date===ds).reduce((n,x)=>n+x.minutes,0)};

    const topicName=(id,t)=>subj(id).topics[t][0];
    const nav=()=>document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));
    function dashboard(){const due=dueTopics();const weekly=[-6,-5,-4,-3,-2,-1,0].map((o,i)=>({m:daily(o),label:['S','M','T','W','T','F','S'][i]}));const max=Math.max(45,...weekly.map(x=>x.m)); const ranked=[...SUBJECTS].sort((a,b)=>minutes(b.id)-minutes(a.id)).slice(0,4);
      return `<section class="hero"><div class="eyebrow">Your electrical engineering cockpit</div><div class="hero-grid"><div><h1>Small sessions.<br/>Serious momentum.</h1><p>Track each topic, make revision automatic, and practice what matters next.</p><button class="cta" data-action="open-session">Start a study session →</button></div><div class="focus-mark"><strong>${todayMins()} min</strong><span>studied today</span></div></div></section>

      <div class="grid"><article class="panel"><div class="eyebrow">Last seven days</div><h2>Study rhythm</h2><div class="week">${weekly.map(x=>`<div class="day"><i style="height:${Math.max(5,Math.round(x.m/max*92))}%"></i><b>${x.m||'–'}</b><span>${x.label}</span></div>`).join('')}</div></article><article class="panel"><div class="section-head"><div><div class="eyebrow">Revision planner</div><h2>Bring these back</h2></div><button class="link-btn" data-screen-link="revision">Open</button></div><div class="revision-list">${due.slice(0,3).map(x=>`<div class="revision-item"><span class="date-chip">${x.label}</span><div class="grow"><strong>${x.t[0]}</strong><small class="muted">${x.s.name}</small></div><button class="icon-btn" title="Mark reviewed" data-action="revise" data-subject="${x.s.id}" data-topic="${x.i}">✓</button></div>`).join('')||'<p class="empty">You are caught up. Nice work.</p>'}</div></article></div></section>
      <section class="section"><div class="section-head"><div><div class="eyebrow">Official notices</div><h2>Upcoming exam sources</h2></div><button class="link-btn" data-action="open-exams">Browse</button></div><article class="exam-card"><div class="exam-date"><small>${EXAMS[0].month}</small>${EXAMS[0].day}</div><div class="grow"><strong>${EXAMS[0].name}</strong><p class="muted" style="font-size:13px">${EXAMS[0].body}</p></div><button class="icon-btn" data-action="visit-exam" data-url="${EXAMS[0].source}" title="Open official source">↗</button></article></section>`; }
    function learn(){const q=learnSearch.toLowerCase().trim();const list=SUBJECTS.filter(s=>!q||s.name.toLowerCase().includes(q)||s.topics.some(t=>t.join(' ').toLowerCase().includes(q)));return `<section><div class="eyebrow">Core EE syllabus</div><h1 style="margin-top:6px">Learn by subject.</h1><p class="muted" style="margin-top:8px">Tap a topic to track the time you give it, questions you complete, and its revision history.</p></section><section class="section"><div class="filter-row"><input type="search" id="learnSearch" value="${esc(learnSearch)}" placeholder="Search a subject or topic" aria-label="Search syllabus" /></div><div class="grid subject-grid">${list.map(s=>{const complete=subjectDone(s.id),pct=Math.round(complete/s.topics.length*100);return `<article class="subject-card" data-action="open-subject" data-subject="${s.id}"><div class="symbol" style="color:${s.color}">${s.icon}</div><h3>${s.name}</h3><div class="subject-meta"><span>${s.topics.length} topics</span><span>${formatMins(minutes(s.id))}</span></div><div class="bar"><span style="width:${pct}%;background:${s.color}"></span></div><small class="muted">${complete}/${s.topics.length} complete · ${qCount(s.id)} Qs · ${subjectReview(s.id)}</small></article>`}).join('')}</div>${!list.length?'<p class="empty">No part of the core syllabus matches that search.</p>':''}</section>`}
    function subjectPage(id){const s=subj(id);return `<section><button class="link-btn" data-screen-link="learn">← All subjects</button><div class="eyebrow" style="margin-top:14px">${formatMins(minutes(id))} logged · ${qCount(id)} questions</div><h1 style="margin-top:4px">${s.name}</h1><p class="muted" style="margin-top:8px">Full core topic map. Mark topics complete as you finish your course plan.</p></section><section class="section">${s.topics.map((t,i)=>{const p=progress(id,i), d=dueInfo(id,i);return `<article class="topic-group ${p.done?'complete':''}"><div class="topic-top"><div><h3>${t[0]}</h3><small>${formatMins(p.minutes||0)} · ${p.questions||0} questions · ${d.label}</small></div><div class="topic-buttons"><button class="icon-btn" data-action="open-session" data-subject="${id}" data-topic="${i}" title="Study this topic">▶</button><button class="icon-btn" data-action="toggle-topic" data-subject="${id}" data-topic="${i}" title="Mark ${p.done?'not complete':'complete'}">${p.done?'↺':'✓'}</button></div></div><div class="topic-sub"><strong>Includes</strong><ul>${t[1].map(x=>`<li>${x}</li>`).join('')}</ul></div></article>`}).join('')}</section>`}
    function practice(){let possible=QUESTIONS.filter(q=>(practiceSubject==='all'||q.s===practiceSubject)&&(practiceTopic==='all'||`${q.s}-${q.t}`===practiceTopic));if(!possible.length)possible=QUESTIONS;let q=possible[questionIndex%possible.length];const answered=activeQuestion?.id===q.id?activeQuestion:null;return `<section><div class="eyebrow">Topic question bank</div><h1 style="margin-top:6px">Practice with a purpose.</h1><p class="muted" style="margin-top:8px">Answers record against the exact subject and topic—so the dashboard stays honest.</p></section><section class="section panel question"><div class="filter-row"><select id="practiceSubject" aria-label="Filter practice by subject"><option value="all">All subjects</option>${SUBJECTS.map(s=>`<option value="${s.id}" ${s.id===practiceSubject?'selected':''}>${s.name}</option>`).join('')}</select><select id="practiceTopic" aria-label="Filter practice by topic"><option value="all">All topics</option>${SUBJECTS.filter(s=>practiceSubject==='all'||s.id===practiceSubject).flatMap(s=>s.topics.map((t,i)=>`<option value="${s.id}-${i}" ${`${s.id}-${i}`===practiceTopic?'selected':''}>${s.name}: ${t[0]}</option>`)).join('')}</select></div><span class="tag">${subj(q.s).name} · ${topicName(q.s,q.t)}</span><p class="question-text">${q.q}</p><div class="answers">${q.a.map((a,i)=>`<button class="answer ${answered?(i===q.c?'correct':i===answered.choice?'incorrect':''):''}" data-action="answer" data-id="${q.id}" data-choice="${i}" ${answered?'disabled':''}>${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div>${answered?`<div class="explanation"><strong>${answered.choice===q.c?'Correct. ':'Keep going. '}</strong>${q.e}</div><button class="cta" style="margin-top:auto" data-action="next-question">Next question →</button>`:'<p class="muted" style="margin-top:auto;font-size:13px">Choose one answer. A question is counted once per topic, but you may revisit it anytime.</p>'}</section>`}
    function revision(){const due=dueTopics();return `<section><div class="eyebrow">Spaced revision</div><h1 style="margin-top:6px">Remember it when it counts.</h1><p class="muted" style="margin-top:8px">Intervals progress from 1 → 3 → 7 → 14 → 30 days when you mark a topic reviewed.</p></section><section class="section"><div class="filter-row"><button class="cta" data-action="review-all" ${!due.length?'disabled':''}>Review next due topic</button></div>${due.map(x=>`<article class="revision-item" style="margin-bottom:10px"><span class="date-chip">${x.label}</span><div class="grow"><strong>${x.t[0]}</strong><small class="muted">${x.s.name} · ${formatMins(minutes(x.s.id,x.i))} studied · ${qCount(x.s.id,x.i)} questions</small></div><button class="outline" data-action="revise" data-subject="${x.s.id}" data-topic="${x.i}">Mark reviewed</button></article>`).join('')||'<article class="panel empty"><div style="font-size:28px">✦</div><h2>You are fully revised</h2><p style="margin-top:7px">Your next review will appear automatically as each interval arrives.</p></article>'}</section><section class="section panel"><div class="eyebrow">How the planner works</div><h2 style="margin-top:4px">Revision is topic-first</h2><p class="muted" style="margin-top:8px">Reviewing a topic advances its own interval. Your subject revision status is always the combination of its topics—not a vague single reminder.</p></section>`}
    function library(){return `<section><div class="eyebrow">Subject-wise reader</div><h1 style="margin-top:6px">Your EE library.</h1><p class="muted" style="margin-top:8px">Add your own notes, textbooks, or institute PDFs. Files stay in this browser on this device.</p></section><section class="section panel"><div class="section-head"><div><h2>PDF resources</h2><p class="muted" style="font-size:13px;margin-top:3px">Open them inside the app.</p></div><label class="cta" for="pdfInput" style="display:inline-flex;align-items:center">+ Add PDF</label><input id="pdfInput" type="file" accept="application/pdf" hidden /></div><div id="pdfList">${state.pdfs.length?state.pdfs.map(p=>`<div class="library-card"><div class="pdf-icon">▤</div><div class="grow"><b>${esc(p.name)}</b><small>${esc(subj(p.subject)?.name||'Unassigned')} · ${(p.size/1024/1024).toFixed(1)} MB</small></div><button class="icon-btn" data-action="read-pdf" data-pdf="${p.id}" title="Read PDF">↗</button><button class="icon-btn danger" data-action="delete-pdf" data-pdf="${p.id}" title="Remove PDF">×</button></div>`).join(''):'<div class="empty"><div style="font-size:28px">▤</div><h3 style="margin-top:5px">Build your reading shelf</h3><p style="margin-top:5px">Add a subject-wise PDF and it will appear here.</p></div>'}</div></section><section class="section panel"><div class="eyebrow">Note</div><h2 style="margin-top:4px">Bring your own curriculum</h2><p class="muted" style="margin-top:8px">The syllabus map is broad because EE syllabi vary by college and exam. Your PDFs make this your actual course, while the tracker stays organized by the core topics.</p></section>`}
    function render(){ badge(); nav(); let html=screen==='dashboard'?dashboard():screen==='learn'?learn():screen.startsWith('subject:')?subjectPage(screen.slice(8)):screen==='practice'?practice():screen==='revision'?revision():library(); app.innerHTML=html; bindInputs(); }
    function bindInputs(){const ls=document.getElementById('learnSearch');if(ls)ls.addEventListener('input',e=>{learnSearch=e.target.value;render()});const ps=document.getElementById('practiceSubject');if(ps)ps.addEventListener('change',e=>{practiceSubject=e.target.value;practiceTopic='all';questionIndex=0;activeQuestion=null;render()});const pt=document.getElementById('practiceTopic');if(pt)pt.addEventListener('change',e=>{practiceTopic=e.target.value;questionIndex=0;activeQuestion=null;render()});const pdf=document.getElementById('pdfInput');if(pdf)pdf.addEventListener('change',handlePdf);}
    function openModal(content){modal.innerHTML=content;modal.classList.add('show');} function closeModal(){modal.classList.remove('show');modal.innerHTML='';}
    function sessionModal(id='',t=''){const sOptions=SUBJECTS.map(s=>`<option value="${s.id}" ${s.id===id?'selected':''}>${s.name}</option>`).join('');openModal(`<div class="sheet" id="sessionSheet"><div class="sheet-head"><div><div class="eyebrow">Focus timer</div><h2>Record a study session</h2></div><button class="close" data-action="close-modal">×</button></div><div class="form"><label>Subject<select id="sessionSubject">${sOptions}</select></label><label>Topic<select id="sessionTopic"></select></label></div><div class="timer-display" id="sessionTimer">25:00</div><div class="timer-actions"><button class="outline" data-action="close-modal">Cancel</button><button class="cta" data-action="start-timer">Start focus</button></div></div>`);const ss=document.getElementById('sessionSubject'),st=document.getElementById('sessionTopic');const fill=()=>{st.innerHTML=subj(ss.value).topics.map((x,i)=>`<option value="${i}" ${ss.value===id&&i===+t?'selected':''}>${x[0]}</option>`).join('')};fill();ss.addEventListener('change',fill);}
    function startTimer(){const id=document.getElementById('sessionSubject').value,t=+document.getElementById('sessionTopic').value;state.active={started:Date.now(),subject:id,topic:t};save();closeModal();syncTimer();showToast('Focus session started. You’ve got this.');}
    function elapsed(){return state.active?Math.floor((Date.now()-state.active.started)/1000):0} function timeText(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function syncTimer(){const bar=document.getElementById('timerBar');if(!state.active){bar.classList.remove('show');clearInterval(tick);tick=null;return}bar.classList.add('show');document.getElementById('timerLabel').textContent=`${subj(state.active.subject).name} · ${topicName(state.active.subject,state.active.topic)}`;const update=()=>document.getElementById('miniTimer').textContent=timeText(elapsed());update();if(!tick)tick=setInterval(update,1000);}
    function stopTimer(){if(!state.active)return;const a=state.active,mins=Math.max(1,Math.round(elapsed()/60));setProgress(a.subject,a.topic,{minutes:minutes(a.subject,a.topic)+mins});state.sessions.unshift({date:dayKey(),minutes:mins,subject:a.subject,topic:a.topic});state.active=null;save();syncTimer();render();showToast(`${mins} min recorded in ${topicName(a.subject,a.topic)}.`);}
    function markReviewed(id,t){const p=progress(id,t);setProgress(id,t,{lastRevised:new Date().toISOString(),stage:Math.min((p.stage||0)+1,4)});render();showToast(`${topicName(id,t)} moved to its next revision interval.`)}
    function answer(id,choice){const q=QUESTIONS.find(x=>x.id===id);if(!q)return;const correct=+choice===q.c;activeQuestion={id,choice:+choice};if(!state.answered[id]){state.answered[id]={correct};setProgress(q.s,q.t,{questions:qCount(q.s,q.t)+1,correct:(progress(q.s,q.t).correct||0)+(correct?1:0)});save()}render();}
    function examsModal(){openModal(`<div class="sheet"><div class="sheet-head"><div><div class="eyebrow">Live exam sources</div><h2>Official notices only</h2></div><button class="close" data-action="close-modal">×</button></div><p class="muted" style="margin-bottom:13px">Dates and eligibility change. These buttons open the official publisher—always verify there before planning or applying.</p><div class="grid">${EXAMS.map(x=>`<article class="exam-card"><div class="exam-date"><small>${x.month}</small>${x.day}</div><div class="grow"><strong>${x.name}</strong><p class="muted" style="font-size:13px">${x.body}</p></div><button class="icon-btn" data-action="visit-exam" data-url="${x.source}">↗</button></article>`).join('')}</div><p class="muted" style="font-size:12px;margin-top:15px">For automatic in-app dates, a future version needs your country, university/exam targets, and a verified notification service.</p></div>`)}
    async function db(){return new Promise((res,rej)=>{const r=indexedDB.open('electrotrack-pdfs',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})} async function putFile(file,meta){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('files','readwrite').objectStore('files').put({...meta,file});r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})} async function getFile(id){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>res(r.result?.file);r.onerror=()=>rej(r.error)})} async function removeFile(id){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('files','readwrite').objectStore('files').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
    async function handlePdf(e){const file=e.target.files[0];if(!file)return;const choices=SUBJECTS.map((s,i)=>`${i+1}. ${s.name}`).join('\n');const selected=prompt(`Which subject should receive “${file.name}”?\n\n${choices}\n\nEnter its number:`, '1');const idx=Number(selected)-1;if(!SUBJECTS[idx]){showToast('PDF was not added—choose a subject number next time.');return}const meta={id:`pdf-${Date.now()}`,name:file.name,size:file.size,subject:SUBJECTS[idx].id,added:new Date().toISOString()};try{await putFile(file,meta);state.pdfs.push(meta);save();render();showToast('PDF added to your library.')}catch(err){showToast('This browser could not save that PDF. Try a smaller file.')}}
    async function readPdf(id){const file=await getFile(id);if(!file){showToast('The original PDF is no longer stored on this device.');return}const meta=state.pdfs.find(p=>p.id===id);const url=URL.createObjectURL(file);openModal(`<div class="sheet" style="max-width:900px"><div class="sheet-head"><h2>${esc(meta.name)}</h2><button class="close" data-action="close-modal">×</button></div><iframe src="${url}" title="${esc(meta.name)}"></iframe></div>`)}
    async function deletePdf(id){const meta=state.pdfs.find(p=>p.id===id);if(!meta||!confirm(`Remove “${meta.name}” from this device?`))return;await removeFile(id);state.pdfs=state.pdfs.filter(p=>p.id!==id);save();render();showToast('PDF removed from this device.');}
    document.addEventListener('click', async e=>{const n=e.target.closest('[data-action],[data-screen],[data-screen-link]');if(!n)return;if(n.dataset.screen){screen=n.dataset.screen;activeQuestion=null;render();return}if(n.dataset.screenLink){screen=n.dataset.screenLink;render();return}const a=n.dataset.action;if(a==='open-session')sessionModal(n.dataset.subject,n.dataset.topic);if(a==='close-modal')closeModal();if(a==='start-timer')startTimer();if(a==='stop-timer')stopTimer();if(a==='open-subject'){screen=`subject:${n.dataset.subject}`;render()}if(a==='toggle-topic'){const p=progress(n.dataset.subject,+n.dataset.topic);setProgress(n.dataset.subject,+n.dataset.topic,{done:!p.done});render();showToast(p.done?'Topic reopened.':'Topic marked complete.')}if(a==='revise')markReviewed(n.dataset.subject,+n.dataset.topic);if(a==='review-all'){const x=dueTopics()[0];if(x)markReviewed(x.s.id,x.i)}if(a==='answer')answer(n.dataset.id,+n.dataset.choice);if(a==='next-question'){questionIndex++;activeQuestion=null;render()}if(a==='open-exams')examsModal();if(a==='visit-exam')window.open(n.dataset.url,'_blank','noopener');if(a==='read-pdf')await readPdf(n.dataset.pdf);if(a==='delete-pdf')await deletePdf(n.dataset.pdf);});
    modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    render();syncTimer();
  })();
  </script>
</body>
